<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WANTED 6 - 15分逃げ切れ</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ========== 設定 ========== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

const WORLD = 3200, BLOCK = 400, ROAD = 120;   // マップ(2D平面)
const GOAL = 900;                               // 15分 = 900秒
const STAR_AT = [0, 120, 300, 480, 660, 810];   // 各手配度に上がる秒数

// GTA SA準拠の体制: ★1 徒歩警官(警棒)/パトカー/白バイ → ★2 拳銃 → ★3 ショットガン+Maverick+道路封鎖
//   → ★4 SWAT+Enforcer+強力な封鎖 → ★5 FBI+Rancher+Hydra → ★6 軍隊+Barracks OL+Rhino
const TYPES = {
  // ---- 徒歩 ----
  baton:  { hp:40,  sp:2.4, dmg:5,  rate:700,  range:26,  r:13, xp:8,  melee:true, lab:'LSPD', lc:'#93c5fd' },   // 警棒・逮捕
  cop:    { hp:40,  sp:2.3, dmg:6,  rate:900,  range:230, r:13, xp:10, lab:'LSPD', lc:'#93c5fd' },              // Colt45
  shotgun:{ hp:55,  sp:2.3, dmg:4,  rate:1300, range:190, r:13, xp:20, pellets:5, spread:.35, lab:'LSPD', lc:'#93c5fd' },
  swat:   { hp:120, sp:2.4, dmg:11, rate:420,  range:280, r:14, xp:30, lab:'SWAT', lc:'#e5e7eb' },
  fbi:    { hp:80,  sp:2.7, dmg:10, rate:600,  range:270, r:13, xp:22, lab:'FBI',  lc:'#fde047' },
  army:   { hp:170, sp:2.5, dmg:12, rate:480,  range:320, r:14, xp:45, pellets:2, spread:.05, lab:'ARMY', lc:'#bef264' }, // M4/MP5
  // ---- 乗り物 (veh:体当たり / cargo:近づくと乗員が降車 / gun:手配度で武装が変化) ----
  patrol: { hp:170, sp:4.0, dmg:6,  rate:900,  range:240, r:20, xp:25, veh:true, gun:true, ram:8,  cargo:2, lab:'LSPD PATROL', lc:'#93c5fd' },
  biker:  { hp:35,  sp:4.6, dmg:6,  rate:800,  range:220, r:11, xp:14, veh:true, gun:true, ram:6,  lab:'HPV-1000', lc:'#93c5fd' },
  enforcer:{hp:420, sp:3.0, dmg:9,  rate:450,  range:280, r:22, xp:75, veh:true, ram:14, cargo:3, cargoT:'swat', lab:'ENFORCER', lc:'#e5e7eb' },
  rancher:{ hp:260, sp:3.7, dmg:10, rate:550,  range:260, r:19, xp:55, veh:true, ram:10, cargo:2, cargoT:'fbi',  lab:'FBI RANCHER', lc:'#fde047' },
  barracks:{hp:520, sp:2.4, dmg:0,  rate:1000, range:100, r:24, xp:110,veh:true, ram:22, cargo:4, cargoT:'army', lab:'BARRACKS OL', lc:'#bef264' },
  tank:   { hp:800, sp:1.2, dmg:38, rate:2300, range:520, r:28, xp:200, splash:80, lab:'RHINO', lc:'#bef264' },
  // ---- 空 ----
  heli:   { hp:320, sp:2.6, dmg:5,  rate:200,  range:330, r:20, xp:120, fly:true, lab:'MAVERICK', lc:'#93c5fd' },  // サーチライト
  hydra:  { hp:220, sp:7,   dmg:24, rate:2200, range:500, r:18, xp:150, fly:true, jet:true, splash:55, lab:'HYDRA', lc:'#fca5a5' } // 一撃離脱+ミサイル
};
const LIMIT = { heli:2, hydra:2, enforcer:3, rancher:4, barracks:2, tank:3, patrol:6, biker:4 };   // 同時出現の上限
const FOOT = { 1:'baton', 2:'cop', 3:'shotgun', 4:'swat', 5:'fbi', 6:'army' };                      // 上限時の代替(徒歩)
const SPAWN = {                            // 手配度ごとの出現テーブル [種類, 重み]
  1: [['baton',4],['patrol',3],['biker',2]],
  2: [['patrol',4],['biker',3],['cop',3]],
  3: [['patrol',4],['biker',2],['shotgun',2],['heli',1]],
  4: [['swat',4],['enforcer',3],['heli',1],['patrol',1]],
  5: [['fbi',4],['rancher',4],['heli',1],['hydra',1],['swat',1]],
  6: [['army',4],['barracks',2],['tank',2],['heli',1],['hydra',1],['fbi',1]]
};
// 見た目(上から見た人型): 職業が一目で分かる配色
const STYLE = {
  player:{ body:'#f59e0b', hat:'cap',    hatCol:'#dc2626', mark:'jacket', gun:'pistol'  },   // 橙ジャケット+赤キャップ
  baton: { body:'#1e3a8a', hat:'cap',    hatCol:'#0f1b4d', mark:'badge',  gun:'baton'   },   // 警官: 紺制服+制帽+金バッジ
  cop:   { body:'#1e3a8a', hat:'cap',    hatCol:'#0f1b4d', mark:'badge',  gun:'pistol'  },
  shotgun:{body:'#1e3a8a', hat:'cap',    hatCol:'#0f1b4d', mark:'badge',  gun:'shotgun' },
  biker: { body:'#1e3a8a', hat:'helmet', hatCol:'#f8fafc', mark:'badge',  gun:'none'    },   // 白バイ: 白ヘルメット
  swat:  { body:'#1f2937', hat:'visor',  hatCol:'#0b0f19', mark:'vest',   gun:'rifle'   },   // SWAT: 黒装備+バイザー
  fbi:   { body:'#0f172a', hat:'sun',    hatCol:'#1f2937', mark:'fbi',    gun:'pistol'  },   // FBI: 黒スーツ+サングラス+黄色パッチ
  army:  { body:'#556b2f', hat:'helmet', hatCol:'#3f4d22', mark:'camo',   gun:'rifle'   }    // 兵士: 迷彩+ヘルメット
};
const ASTYLE = {
  gunner: { body:'#0d9488', hat:'cap',    hatCol:'#134e4a', mark:'vest',  gun:'pistol'  },
  sniper: { body:'#6b705c', hat:'hood',   hatCol:'#57534e', mark:'camo',  gun:'sniper'  },
  shotgun:{ body:'#ea580c', hat:'helmet', hatCol:'#9a3412', mark:'vest',  gun:'shotgun' },
  medic:  { body:'#f8fafc', hat:'cap',    hatCol:'#f8fafc', mark:'cross', gun:'none'    }
};
// 味方(複数パターン・複数人OK)
const ALLY = {
  gunner: { hp:70,  rate:480,  dmg:9,  range:300, pel:1, spr:.06, col:'#34d399' },
  sniper: { hp:50,  rate:1500, dmg:45, range:560, pel:1, spr:.01, col:'#a78bfa', spd:3.2 },
  shotgun:{ hp:110, rate:1000, dmg:7,  range:200, pel:5, spr:.35, col:'#fb923c' },
  medic:  { hp:60,  heal:true, col:'#f9a8d4' }
};
// 手配度(w)が上がるほど味方も強くなる (★6でHP約4.5倍 / 火力3倍 / 連射1.6倍)
const allyHp   = w => 1+(w-1)*0.7;
const allyDmg  = w => 1+(w-1)*0.4;
const allyRate = w => 1+(w-1)*0.12;
const UPG = {
  atk:    { t:'攻撃力UP', d:'与ダメージ +20%\n(味方にも反映)' },
  rate:   { t:'連射力UP', d:'発射間隔 -12%' },
  spd:    { t:'移動速度UP', d:'移動速度 +10%' },
  gunner: { t:'味方: 護衛兵', d:'ピストルで常に援護\n連射が速い' },
  sniper: { t:'味方: スナイパー', d:'超長射程・高威力\n連射は遅い' },
  shotgun:{ t:'味方: ショットガン兵', d:'近距離で高火力\nHPが高い' },
  medic:  { t:'味方: 衛生兵', d:'定期的にHPを回復\n攻撃はしない' }
};

/* ========== 状態 ========== */
let state = 'title';           // title / play / dead / clear
let allies, items, picks, need, rbCd, choices, t, p, enemies, bullets, pickups, fx, texts, buildings, parks, kills, last, spawnCd;
const keys = {}; const mouse = { x:0, y:0, down:false };
const cam = { x:0, y:0 };

const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function genMap(){
  buildings = []; parks = [];
  for(let bx=0; bx<WORLD/BLOCK; bx++) for(let by=0; by<WORLD/BLOCK; by++){
    const x = bx*BLOCK+ROAD/2, y = by*BLOCK+ROAD/2, s = BLOCK-ROAD;
    if(Math.abs(bx-4)<=0 && Math.abs(by-4)<=0 || Math.random()<0.22){ parks.push({x,y,w:s,h:s}); continue; }
    // 1ブロックに1〜2棟(路地ができる)
    if(Math.random()<0.5) buildings.push({x:x+rnd(0,30),y:y+rnd(0,30),w:s-rnd(40,90),h:s-rnd(40,90),c:Math.floor(rnd(60,100))});
    else { const h=s/2-12; buildings.push({x,y,w:s,h:h,c:Math.floor(rnd(60,100))},{x,y:y+h+24,w:s,h:h,c:Math.floor(rnd(60,100))}); }
  }
}

function start(){
  genMap();
  t = 0; kills = 0; spawnCd = 0;
  enemies = []; bullets = []; pickups = []; fx = []; texts = [];
  allies = []; items = 0; picks = 0; need = 3; rbCd = 0; choices = [];
  p = { x:WORLD/2, y:WORLD/2, r:13, hp:100, maxHp:100, armor:0, lvl:1, xp:0, next:40, spd:3.2, arrest:0,
        dmg:18, rate:200, cd:0, dash:0, dashCd:0, ang:0, hit:0 };
  state = 'play'; last = performance.now(); TS.l=TS.r=null; TS.dashId=null; audioInit(); AU.step=0;
}

const wanted = () => { let w=1; for(let i=0;i<6;i++) if(t>=STAR_AT[i]) w=i+1; return w; };

/* ========== 衝突 ========== */
function inBuilding(x,y){ return buildings.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h); }
function pushOut(e){
  for(const b of buildings){
    const cx=clamp(e.x,b.x,b.x+b.w), cy=clamp(e.y,b.y,b.y+b.h);
    let dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy);
    if(d<e.r){
      if(d===0){ e.y=b.y-e.r; continue; }
      e.x+=dx/d*(e.r-d); e.y+=dy/d*(e.r-d);
    }
  }
  e.x=clamp(e.x,e.r,WORLD-e.r); e.y=clamp(e.y,e.r,WORLD-e.r);
}

/* ========== ダメージ・演出 ========== */
function hurt(d){
  if(p.dash>0) return;
  const a=Math.min(p.armor,d); p.armor-=a; d-=a; p.hp-=d; p.hit=8;
}
function explode(x,y,rad,dmg){
  fx.push({x,y,r:0,max:rad,life:18});
  if(Math.hypot(p.x-x,p.y-y)<rad+p.r) hurt(dmg);
  allies.forEach(a=>{ if(Math.hypot(a.x-x,a.y-y)<rad+a.r) a.hp-=dmg; });
}
function popText(x,y,s,c='#fff'){ texts.push({x,y,s,c,life:60}); }

function gainXp(v){
  p.xp+=v;
  while(p.xp>=p.next){
    p.xp-=p.next; p.lvl++; p.next=Math.floor(p.next*1.35+10);
    p.maxHp+=10; p.hp=Math.min(p.maxHp,p.hp+30);
    popText(p.x,p.y-30,'LEVEL UP! Lv'+p.lvl,'#fde047');
  }
}

/* ========== 敵 ========== */
function pickType(w){
  const tb=SPAWN[w]; let sum=0; tb.forEach(e=>sum+=e[1]);
  let r=Math.random()*sum;
  for(const [k,wt] of tb){ if((r-=wt)<=0){ if(LIMIT[k]&&enemies.filter(e=>e.type===k).length>=LIMIT[k]) return FOOT[w]; return k; } }
  return tb[0][0];
}
function mk(type,x,y,w){
  const T=TYPES[type];
  const e={type,x,y,r:T.r,hp:T.hp,max:T.hp,cd:rnd(300,Math.min(T.rate,1500)),ang:0,strafe:Math.random()<.5?1:-1};
  if(T.cargo){ e.cargo=T.cargo; e.ct=T.cargoT||(w<2?'baton':w<3?'cop':'shotgun'); }   // 乗員(近づくと降車)
  return e;
}
// ★3以降: 道路封鎖(パトカーで道を塞ぎ、ショットガン警官が待ち構える)
function roadblock(w){
  const hv=w>=4;                       // ★4以降はEnforcerによる強力なバリケード(SWATが守る)
  const a=rnd(0,Math.PI*2), d=rnd(550,800);
  const x=clamp(p.x+Math.cos(a)*d,150,WORLD-150), y=clamp(p.y+Math.sin(a)*d,150,WORLD-150);
  const v=Math.random()<.5, len=hv?44:40, H=hv?34:26, g=hv?18:20;
  let cx=x, cy=y, pcs;
  if(v){ cx=Math.round(x/BLOCK)*BLOCK; pcs=[[cx-g-len,cy-H/2,len,H],[cx+g,cy-H/2,len,H]]; }
  else { cy=Math.round(y/BLOCK)*BLOCK; pcs=[[cx-H/2,cy-g-len,H,len],[cx-H/2,cy+g,H,len]]; }
  if(Math.hypot(cx-p.x,cy-p.y)<450 || inBuilding(cx,cy)) return;
  pcs.forEach(q=>buildings.push({x:q[0],y:q[1],w:q[2],h:q[3],rb:true,hv,life:hv?3600:2400}));
  const gt=hv?'swat':'shotgun';
  for(let i=0;i<2;i++) enemies.push(mk(gt, v?cx+(i?30:-30):cx+H/2+26, v?cy+H/2+26:cy+(i?30:-30), w));
}
function spawn(w){
  for(let i=0;i<12;i++){
    const a=rnd(0,Math.PI*2), d=Math.hypot(W,H)/2+60;
    const x=p.x+Math.cos(a)*d, y=p.y+Math.sin(a)*d;
    if(x<30||y<30||x>WORLD-30||y>WORLD-30||inBuilding(x,y)) continue;
    const type=pickType(w), T=TYPES[type];
    enemies.push(mk(type,x,y,w));
    return;
  }
}
const PISTOL={dmg:6,rate:900,range:230,pellets:1,spread:.09}, SHOT={dmg:4,rate:1300,range:190,pellets:5,spread:.35};
// 武器: パトカー/バイクは手配度で変化(★1 無し→★2 拳銃→★3〜 助手席ショットガン)
function weapon(T,w){ if(T.gun) return w<2?null:(w===2?PISTOL:SHOT); return T.dmg>0?T:null; }
function updateEnemies(dt,k,w){
  let arrest=false; const born=[];
  for(const e of enemies){
    const T=TYPES[e.type];
    const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    e.ang=Math.atan2(dy,dx);
    if(T.jet){                                   // Hydra: 一撃離脱の爆撃機動+ミサイル
      if(e.dir===undefined||d>900) e.dir=e.ang+rnd(-.35,.35);
      e.x+=Math.cos(e.dir)*T.sp*k; e.y+=Math.sin(e.dir)*T.sp*k; e.hd=e.dir; e.cd-=dt;
      if(e.cd<=0 && d<T.range && Math.cos(e.dir-e.ang)>.5){ e.cd=T.rate;
        bullets.push({x:e.x,y:e.y,vx:Math.cos(e.ang)*7,vy:Math.sin(e.ang)*7,dmg:T.dmg*(1+w*0.04),life:Math.ceil(T.range*1.3/7),enemy:true,splash:T.splash,air:true}); }
      continue;
    }
    if(T.veh){ e.chT=(e.chT===undefined?rnd(1500,4000):e.chT)-dt; if(e.chT<0){ e.chg=900; e.chT=rnd(4000,7000); } if(e.chg>0) e.chg-=dt; } // 時々突っ込む
    let mx=0,my=0;
    if(T.melee || d>T.range*0.7 || e.chg>0){ mx=dx/d; my=dy/d; }     // 近づく
    else { mx=-dy/d*e.strafe*0.6; my=dx/d*e.strafe*0.6; }            // 回り込む
    if(!T.melee && !T.veh && d<120){ mx-=dx/d*0.8; my-=dy/d*0.8; }   // 近すぎたら離れる
    const ox=e.x, oy=e.y;
    e.x+=mx*T.sp*k; e.y+=my*T.sp*k;
    if(T.fly){ e.x=clamp(e.x,e.r,WORLD-e.r); e.y=clamp(e.y,e.r,WORLD-e.r); } else pushOut(e);
    if(Math.hypot(e.x-ox,e.y-oy)>0.3) e.hd=Math.atan2(e.y-oy,e.x-ox);
    if(Math.hypot(e.x-ox,e.y-oy)<T.sp*k*0.3 && Math.random()<.02) e.strafe*=-1;
    e.cd-=dt;
    if(e.cargo>0 && d<260){                                           // 乗員が降車
      for(let i=0;i<e.cargo;i++) born.push(mk(e.ct,e.x+rnd(-26,26),e.y+rnd(-26,26),w));
      e.cargo=0;
    }
    if(T.ram){ e.rc=(e.rc||0)-dt; if(d<e.r+p.r+2 && e.rc<=0){ hurt(T.ram); e.rc=800; } }   // 体当たり
    if(T.melee){                                                      // 警棒: 殴る＋逮捕ゲージ
      if(d<e.r+p.r+8){ arrest=true; if(e.cd<=0){ e.cd=T.rate; hurt(T.dmg); } }
    } else {
      const Wp=weapon(T,w);
      if(Wp && e.cd<=0 && d<Wp.range){
        e.cd=Wp.rate*rnd(.9,1.2);
        const n=Wp.pellets||1, sp=T.splash?7:9, spr=Wp.spread||.09;
        for(let i=0;i<n;i++){
          const a=e.ang+rnd(-spr,spr);
          bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:Wp.dmg*(1+w*0.04),life:Math.ceil(Wp.range*1.2/sp),enemy:true,splash:T.splash,air:T.fly});
        }
      }
    }
  }
  born.forEach(b=>enemies.push(b));
  if(p.dash>0) arrest=false;
  p.arrest=clamp(p.arrest+(arrest?1.1*k:-0.6*k),0,100);
  if(p.arrest>=100) state='dead';
  enemies=enemies.filter(e=>{ const dd=Math.hypot(e.x-p.x,e.y-p.y); return dd<1400 && !(dd>900 && !SPAWN[w].some(q=>q[0]===e.type)); });  // 遠くの旧ランクの敵は消す
}
// 味方AI: プレイヤーの周囲を護衛しつつ、近い敵を自動で撃つ
function updateAllies(dt,k){
  const w=wanted();
  allies.forEach((a,i)=>{
    const A=ALLY[a.kind];
    if(a.w!==w){ // 手配度が変わったら耐久力を引き上げ、少し回復
      const nm=Math.round(A.hp*allyHp(w));
      a.hp=a.w ? Math.min(nm,a.hp/a.max*nm+nm*.3) : nm; a.max=nm; a.w=w;
    }
    if(Math.hypot(p.x-a.x,p.y-a.y)>700){ a.x=p.x; a.y=p.y; }
    const ang=i*2.4+t*0.5, off=45+(i%3)*18;
    const tx=p.x+Math.cos(ang)*off, ty=p.y+Math.sin(ang)*off;
    const dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
    if(d>6){ const s=Math.min(d,(A.spd||3.6)*k*(d>120?1.6:1)); a.x+=dx/d*s; a.y+=dy/d*s; }
    pushOut(a); a.cd-=dt;
    if(A.heal){ if(a.cd<=0){ a.cd=1200; allies.forEach(o=>{ if(o!==a&&Math.hypot(o.x-a.x,o.y-a.y)<180) o.hp=Math.min(o.max,o.hp+o.max*.05); }); if(p.hp<p.maxHp&&Math.hypot(a.x-p.x,a.y-p.y)<200){ p.hp=Math.min(p.maxHp,p.hp+4+(w-1)*2); popText(p.x,p.y-24,'+','#f9a8d4'); } } return; }
    let tg=null, bd=A.range;
    for(const e of enemies){ const dd=Math.hypot(e.x-a.x,e.y-a.y); if(dd<bd){ bd=dd; tg=e; } }
    if(tg){
      a.ang=Math.atan2(tg.y-a.y,tg.x-a.x);
      if(a.cd<=0){ a.cd=A.rate/allyRate(w);
        for(let j=0;j<A.pel;j++){ const q=a.ang+rnd(-A.spr,A.spr);
          bullets.push({x:a.x,y:a.y,vx:Math.cos(q)*12,vy:Math.sin(q)*12,dmg:A.dmg*(p.dmg/18)*allyDmg(w),life:Math.ceil(A.range*1.2/12),enemy:false}); } }
    }
  });
  allies=allies.filter(a=>a.hp>0);
}
// 強化3択
function openPick(){
  items=0; picks++; need=3+Math.floor(picks/3);
  choices=['atk','rate','spd','gunner','sniper','shotgun','medic'].sort(()=>Math.random()-.5).slice(0,3);
  state='pick'; pickT=performance.now();
}
function applyPick(id){
  if(id==='atk') p.dmg*=1.2;
  else if(id==='rate') p.rate=Math.max(60,p.rate*.88);
  else if(id==='spd') p.spd*=1.1;
  else if(allies.length<12) allies.push({kind:id,x:p.x,y:p.y,r:11,hp:ALLY[id].hp,max:ALLY[id].hp,w:0,cd:rnd(0,500),ang:0});
  else p.hp=p.maxHp;
  state='play'; last=performance.now(); mouse.down=false;
}

/* ========== 更新 ========== */
function update(dt){
  const k=dt/16.67; t+=dt/1000;
  const w=wanted();

  // 移動(上下左右)
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const lv=stickVec(TS.l); if(lv&&lv.m>.2){ ix=lv.x; iy=lv.y; }
  const il=Math.hypot(ix,iy)||1;
  let sp=p.spd;
  if(p.dash>0){ sp=9; p.dash-=dt; }
  if(p.dashCd>0) p.dashCd-=dt;
  if((keys[' ']||TS.dashId!==null) && p.dashCd<=0 && (ix||iy)){ p.dash=180; p.dashCd=2200; }
  p.x+=ix/il*sp*k; p.y+=iy/il*sp*k; pushOut(p);

  // 射撃
  const rv=stickVec(TS.r), fire=!!(rv&&rv.m>.25);
  if(fire) p.ang=Math.atan2(rv.y,rv.x); else if(!touchMode) p.ang=Math.atan2(mouse.y+cam.y-p.y, mouse.x+cam.x-p.x);
  p.cd-=dt;
  if((mouse.down||fire) && p.cd<=0){
    p.cd=p.rate; const a=p.ang+rnd(-.04,.04);
    bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*13,vy:Math.sin(a)*13,dmg:p.dmg,life:60,enemy:false});
  }
  if(p.hit>0) p.hit--;
  updateAllies(dt,k);

  // 敵スポーン (手配度が上がるほど数・頻度が増える)
  spawnCd-=dt;
  const cur=enemies.filter(e=>SPAWN[w].some(q=>q[0]===e.type)).length;   // 旧ランクの敵は上限に数えない
  if(cur<5+w*5 && spawnCd<=0){ spawn(w); spawnCd=950-w*120; }
  rbCd-=dt; if(w>=3 && rbCd<=0){ roadblock(w); rbCd=25000; }
  buildings.forEach(b=>{ if(b.rb) b.life-=k; }); buildings=buildings.filter(b=>!b.rb||b.life>0);
  updateEnemies(dt,k,w);

  // 弾
  for(const b of bullets){
    b.x+=b.vx*k; b.y+=b.vy*k; b.life-=k;
    if((!b.air&&inBuilding(b.x,b.y))||b.x<0||b.y<0||b.x>WORLD||b.y>WORLD){ b.life=0; }
    else if(b.enemy){
      if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+3){ b.life=0; if(!b.splash) hurt(b.dmg); }
      else for(const a of allies){ if(Math.hypot(b.x-a.x,b.y-a.y)<a.r+3){ b.life=0; if(!b.splash) a.hp-=b.dmg; break; } }
    } else {
      for(const e of enemies){
        if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){ e.hp-=b.dmg; b.life=0; fx.push({x:b.x,y:b.y,r:2,max:8,life:6}); break; }
      }
    }
    if(b.life<=0 && b.splash) explode(b.x,b.y,b.splash,b.dmg);
  }
  bullets=bullets.filter(b=>b.life>0);

  // 撃破 → 経験値・ドロップ
  for(const e of enemies) if(e.hp<=0){
    kills++; gainXp(TYPES[e.type].xp);
    fx.push({x:e.x,y:e.y,r:4,max:e.type==='tank'?60:22,life:14});
    const r=Math.random();
    if(r<.2) pickups.push({x:e.x,y:e.y,kind:'hp',life:900});
    else if(r<.4) pickups.push({x:e.x,y:e.y,kind:'armor',life:900});
  }
  enemies=enemies.filter(e=>e.hp>0);

  // ピックアップ
  for(const q of pickups){
    q.life-=k;
    if(Math.hypot(q.x-p.x,q.y-p.y)<p.r+14){
      q.life=0;
      if(q.kind==='hp'){ p.hp=Math.min(p.maxHp,p.hp+35); popText(p.x,p.y-24,'+HP','#f87171'); }
      else { p.armor=Math.min(100,p.armor+40); popText(p.x,p.y-24,'+ARMOR','#60a5fa'); }
      if(++items>=need && state==='play') openPick();
    }
  }
  pickups=pickups.filter(q=>q.life>0);

  fx.forEach(f=>{ f.life-=k; f.r+=(f.max-f.r)*.25*k; }); fx=fx.filter(f=>f.life>0);
  texts.forEach(s=>{ s.life-=k; s.y-=.5*k; }); texts=texts.filter(s=>s.life>0);

  if(p.hp<=0) state='dead';
  else if(t>=GOAL) state='clear';
}

/* ========== 描画 ========== */
function draw(){
  cam.x=clamp(p.x-W/2,0,Math.max(0,WORLD-W)); cam.y=clamp(p.y-H/2,0,Math.max(0,WORLD-H));
  ctx.fillStyle='#2b2d31'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(-cam.x,-cam.y);

  // 道路のセンターライン
  ctx.strokeStyle='#6b6f76'; ctx.lineWidth=3; ctx.setLineDash([24,24]);
  for(let i=0;i<=WORLD/BLOCK;i++){
    ctx.beginPath(); ctx.moveTo(i*BLOCK,0); ctx.lineTo(i*BLOCK,WORLD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*BLOCK); ctx.lineTo(WORLD,i*BLOCK); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle='#2f5d34'; parks.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  buildings.forEach(b=>{
    if(b.rb){                                   // 道路封鎖: パトカー(白) / Enforcer(黒+黄)
      ctx.fillStyle=b.hv?'#1f2937':'#f8fafc'; ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle=(t%0.6<0.3)?'#ef4444':'#3b82f6';
      if(b.w>b.h) ctx.fillRect(b.x+b.w*.4,b.y+2,b.w*.2,b.h-4); else ctx.fillRect(b.x+2,b.y+b.h*.4,b.w-4,b.h*.2);
      if(b.hv){ ctx.fillStyle='#facc15'; if(b.w>b.h) ctx.fillRect(b.x+4,b.y+b.h*.42,b.w*.25,b.h*.16); else ctx.fillRect(b.x+b.w*.42,b.y+4,b.w*.16,b.h*.25); }
    } else { ctx.fillStyle=`rgb(${b.c},${b.c+4},${b.c+10})`; ctx.fillRect(b.x,b.y,b.w,b.h); }
    ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.strokeRect(b.x,b.y,b.w,b.h);
  });
  ctx.strokeStyle='#f43f5e'; ctx.lineWidth=6; ctx.strokeRect(0,0,WORLD,WORLD);

  pickups.forEach(q=>{
    ctx.fillStyle=q.kind==='hp'?'#ef4444':'#3b82f6';
    ctx.fillRect(q.x-9,q.y-9,18,18); ctx.fillStyle='#fff';
    ctx.fillRect(q.x-5,q.y-1.5,10,3); if(q.kind==='hp') ctx.fillRect(q.x-1.5,q.y-5,3,10);
  });

  const list=enemies.slice().sort((a,b)=>(TYPES[a.type].fly?1:0)-(TYPES[b.type].fly?1:0));   // 空中ユニットは最前面
  for(const e of list){
    const T=TYPES[e.type];
    if(e.type==='heli') drawHeli(e);
    else if(e.type==='hydra') drawJet(e);
    else if(T.veh) drawVeh(e);
    else if(e.type==='tank') drawTank(e);
    else drawPerson(e.x,e.y,e.ang,e.r,STYLE[e.type]);
    const top=e.y-e.r-(T.fly?4:0);
    ctx.fillStyle='#000'; ctx.fillRect(e.x-e.r,top-10,e.r*2,4);
    ctx.fillStyle='#ef4444'; ctx.fillRect(e.x-e.r,top-10,e.r*2*e.hp/e.max,4);
    ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='#000';
    ctx.strokeText(T.lab,e.x,top-13); ctx.fillStyle=T.lc; ctx.fillText(T.lab,e.x,top-13);
  }

  for(const a of allies){
    drawPerson(a.x,a.y,a.ang,a.r,ASTYLE[a.kind]);
    ctx.fillStyle='#000'; ctx.fillRect(a.x-10,a.y-a.r-8,20,3); ctx.fillStyle='#4ade80'; ctx.fillRect(a.x-10,a.y-a.r-8,20*a.hp/a.max,3);
  }
  // プレイヤー(橙ジャケット+赤キャップ+黄色のリングで見分けやすく)
  ctx.strokeStyle='#fde047aa'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+5,0,7); ctx.stroke();
  drawPerson(p.x,p.y,p.ang,p.r,STYLE.player,{alpha:p.dash>0?.45:1,hit:p.hit>0});

  bullets.forEach(b=>{ ctx.fillStyle=b.enemy?(b.splash?'#fb923c':'#f87171'):'#fde047';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.splash?6:3,0,7); ctx.fill(); });
  fx.forEach(f=>{ ctx.fillStyle=`rgba(251,146,60,${clamp(f.life/14,0,1)})`; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); });
  ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  texts.forEach(s=>{ ctx.fillStyle=s.c; ctx.fillText(s.s,s.x,s.y); });
  ctx.restore();
  hud();
  if(isTouch) drawTouchUI();
}

  if(p.arrest>1){ bar(W/2-100,H-40,200,14,p.arrest/100,'#38bdf8'); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('逮捕されそう！ダッシュで振り切れ',W/2,H-48); ctx.textAlign='left'; }
  { const m=muteRect(); ctx.fillStyle='#0008'; ctx.fillRect(m.x,m.y,m.w,m.h); ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText(AU.mute?'🔇':'🔊',m.x+m.w/2,m.y+21); ctx.textAlign='left'; }   // ミュート(Mキー/タップ)
  { const m=pauseRect(); ctx.fillStyle='#0008'; ctx.fillRect(m.x,m.y,m.w,m.h); ctx.fillStyle='#fff'; ctx.fillRect(m.x+11,m.y+7,5,14); ctx.fillRect(m.x+20,m.y+7,5,14); }   // ポーズ(P/Escキー・タップ)
  // 進行バー
  bar(W/2-150,12,300,8,t/GOAL,'#facc15');
}
/* ========== ポーズ ========== */
function setPause(on){
  if(on && state==='play'){ state='pause'; TS.l=TS.r=null; TS.dashId=null; mouse.down=false; }
  else if(!on && state==='pause'){ state='play'; last=performance.now(); }
}
const pauseRect = () => ({ x:W-90, y:10, w:36, h:28 });
const pauseHit = (x,y) => { const m=pauseRect(); return x>m.x-3&&x<m.x+m.w+3&&y>m.y-6&&y<m.y+m.h+6; };
const PAUSE_BTNS = ['▶ 再開 (P / Esc)', '↻ 最初からやり直す (R)'];
function pauseBtn(i){ const w=Math.min(250,W-60), h=44; return { x:W/2-w/2, y:(H<500?H*.5:H/2+10)+i*(h+12), w, h }; }
function pauseClick(x,y){
  for(let i=0;i<PAUSE_BTNS.length;i++){ const b=pauseBtn(i);
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){ if(i===0) setPause(false); else start(); return; } }
}
function drawPause(){
  ctx.fillStyle='#000c'; ctx.fillRect(0,0,W,H);
  const ty=H<500?H*.16:H/2-130, rem=Math.max(0,GOAL-t);
  ctx.textAlign='center'; ctx.fillStyle='#facc15'; fit('PAUSE',W-40,48,true); ctx.fillText('PAUSE',W/2,ty);
  const info=`手配度 ★${wanted()} / 残り ${Math.floor(rem/60)}:${String(Math.floor(rem%60)).padStart(2,'0')} / Lv${p.lvl} / 撃破 ${kills} / 味方 ${allies.length}人`;
  ctx.fillStyle='#fff'; fit(info,W-30,16,false); ctx.fillText(info,W/2,ty+34);
  ctx.fillStyle='#9ca3af';
  ['PC: WASD/矢印=移動  マウス=照準・射撃  Space=ダッシュ  M=ミュート','スマホ: 左=移動  右=照準+射撃  DASHボタン'].forEach((l,i)=>{ fit(l,W-30,13,false); ctx.fillText(l,W/2,ty+60+i*20); });
  PAUSE_BTNS.forEach((l,i)=>{ const b=pauseBtn(i);
    ctx.fillStyle='#1f2937'; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeStyle=i?'#9ca3af':'#facc15'; ctx.lineWidth=3; ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='#fff'; fit(l,b.w-16,18,true); ctx.fillText(l,W/2,b.y+b.h/2+6); });
}
function cardRect(i){ const w=Math.min(250,(W-80)/3), h=190, g=20, x0=W/2-(w*3+g*2)/2; return {x:x0+i*(w+g),y:H/2-h/2+20,w,h}; }
function drawPick(){
  ctx.fillStyle='#000b'; ctx.fillRect(0,0,W,H);
  const hd='強化を選べ！ (1/2/3キー・クリック・タップ)';
  ctx.textAlign='center'; ctx.fillStyle='#fde047'; fit(hd,W-30,30,true); ctx.fillText(hd,W/2,H/2-110);
  choices.forEach((id,i)=>{
    const c=cardRect(i), A=ALLY[id], u=UPG[id];
    ctx.fillStyle='#1f2937'; ctx.fillRect(c.x,c.y,c.w,c.h); ctx.strokeStyle=A?A.col:'#facc15'; ctx.lineWidth=3; ctx.strokeRect(c.x,c.y,c.w,c.h);
    ctx.fillStyle='#fff'; const ti=(i+1)+'. '+u.t; fit(ti,c.w-14,19,true); ctx.fillText(ti,c.x+c.w/2,c.y+50);
    ctx.fillStyle='#d1d5db';
    u.d.split('\n').forEach((l,j)=>{ fit(l,c.w-14,14,false); ctx.fillText(l,c.x+c.w/2,c.y+90+j*22); });
  });
}
function fit(txt,maxW,size,bold){ let fs=size; do{ ctx.font=(bold?'bold ':'')+fs+'px sans-serif'; fs--; } while(ctx.measureText(txt).width>maxW && fs>9); }
function overlay(title,sub,col){
  ctx.fillStyle='#000b'; ctx.fillRect(0,0,W,H);
  const ty=H<500?H*.22:H/2-30;
  ctx.textAlign='center'; ctx.fillStyle=col; fit(title,W-40,54,true); ctx.fillText(title,W/2,ty);
  ctx.fillStyle='#fff';
  sub.split('\n').forEach((l,i)=>{ fit(l,W-30,18,false); ctx.fillText(l,W/2,ty+40+i*28); });
}

/* ========== サウンド (Web Audioで生成。音声ファイル不要) ==========
   BGM: 手配度が上がるほどテンポ・音数が増える / サイレン: パトカー・バイク(ウェイル)、Enforcer・Rancher(イェルプ)が近いほど大きく、左右に定位 */
const AU = { ctx:null, mute:false, step:0, next:0, master:null, bgm:null, sfx:null, noise:null, sirens:[] };
try{ AU.mute = localStorage.getItem('wanted6mute')==='1'; }catch(e){}
const SIREN = [['patrol','biker'], ['enforcer','rancher']];
const ROOT = [110,87.31,98,82.41];                                   // Am - F - G - E
const CH = [[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392],[164.81,207.65,246.94,329.63]];
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state!=='running') AU.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=AU.ctx=new AC();
  AU.master=c.createGain(); AU.master.gain.value=AU.mute?0:.7; AU.master.connect(c.destination);
  AU.bgm=c.createGain(); AU.bgm.gain.value=0; AU.bgm.connect(AU.master);
  AU.sfx=c.createGain(); AU.sfx.connect(AU.master);
  const buf=c.createBuffer(1,c.sampleRate,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=buf;
  AU.next=c.currentTime+.1; AU.step=0;
  AU.sirens=[makeSiren(650,1500), makeSiren(520,1050)];
}
function toggleMute(){
  AU.mute=!AU.mute; if(AU.master) AU.master.gain.value=AU.mute?0:.7;
  try{ localStorage.setItem('wanted6mute',AU.mute?'1':'0'); }catch(e){}
}
function makeSiren(lo,hi){
  const c=AU.ctx, o=c.createOscillator(), lfo=c.createOscillator(), depth=c.createGain(), g=c.createGain(), lp=c.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=(lo+hi)/2;
  lfo.type='triangle'; lfo.frequency.value=.45; depth.gain.value=(hi-lo)/2;   // LFOで音程を上下 → サイレン
  lfo.connect(depth); depth.connect(o.frequency);
  lp.type='lowpass'; lp.frequency.value=2200; g.gain.value=0;
  o.connect(lp); lp.connect(g);
  const pan=c.createStereoPanner?c.createStereoPanner():null;
  if(pan){ g.connect(pan); pan.connect(AU.sfx); } else g.connect(AU.sfx);
  o.start(); lfo.start();
  return { g, pan, lfo };
}
function tone(t0,dur,type,f0,vol,f1,cut,dst){
  const c=AU.ctx, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  f.type='lowpass'; f.frequency.value=cut||3000;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(f); f.connect(g); g.connect(dst||AU.bgm); o.start(t0); o.stop(t0+dur+.02);
}
function nz(t0,dur,type,freq,vol){
  const c=AU.ctx, sn=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  sn.buffer=AU.noise; f.type=type; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  sn.connect(f); f.connect(g); g.connect(AU.bgm); sn.start(t0,Math.random()*.5); sn.stop(t0+dur+.02);
}
// 16分音符1ステップ分のBGM。手配度wでレイヤーが増える
function bgmStep(s,t0,sd,w){
  const bar=(s>>4)&3, st=s&15;
  if(st%4===0) tone(t0,.22,'sine',150,.55,45);                                  // キック
  if(w>=2 && (st===4||st===12)) nz(t0,.14,'bandpass',1800,.3);                 // スネア
  if(w>=5 && st===14) nz(t0,.1,'bandpass',2200,.2);
  if(st%2===0 || w>=5) nz(t0,.04,'highpass',7000,w>=5?.1:.14);                  // ハイハット
  if([0,3,6,8,11,14].includes(st)) tone(t0,sd*1.8,'sawtooth',ROOT[bar]*((st===8||st===14)?2:1),.22,null,600+w*120);  // ベース
  if(w>=3 && (w>=5 || st%2===0)){                                               // アルペジオ(★3〜)
    const n=CH[bar][[0,1,2,3,2,1,2,3][st&7]]*((w>=4&&st%4===3)?2:1);
    tone(t0,sd*.9,'square',n,.06,null,2500);
  }
}
function sting(st){                                                              // クリア/BUSTED時の効果音
  if(!AU.ctx) return; const n=AU.ctx.currentTime;
  if(st==='dead') tone(n,.9,'sawtooth',330,.22,70,900,AU.sfx);
  if(st==='clear') [523,659,784,1047].forEach((fq,i)=>tone(n+i*.14,.35,'square',fq,.13,null,3500,AU.sfx));
}
function audioTick(){
  const c=AU.ctx; if(!c) return;
  const now=c.currentTime, live=state==='play', pick=state==='pick', w=(live||pick)?wanted():1;
  AU.bgm.gain.setTargetAtTime(live?.9:pick?.3:0,now,.15);
  if(live||pick){
    const sd=60/(100+(w-1)*10)/4;
    if(AU.next<now-.2) AU.next=now;
    while(AU.next<now+.25){ bgmStep(AU.step,AU.next,sd,w); AU.next+=sd; AU.step=(AU.step+1)%64; }
  } else { AU.next=Math.max(AU.next,now+.05); }
  AU.sirens.forEach((sr,i)=>{                                                    // 最も近い該当車両の距離で音量、方向で左右
    let best=1e9, bdx=0, n=0;
    if(live) for(const e of enemies){ if(SIREN[i].includes(e.type)){ n++; const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<best){ best=d; bdx=e.x-p.x; } } }
    const lvl=n?Math.pow(clamp(1-best/900,0,1),1.5)*(.16+Math.min(n,4)*.02):0;
    sr.g.gain.setTargetAtTime(lvl,now,.08);
    if(sr.pan) sr.pan.pan.setTargetAtTime(clamp(bdx/500,-1,1),now,.05);
    sr.lfo.frequency.setTargetAtTime(i?2.2+.15*w:.4+.04*w,now,.5);              // 手配度が高いほど急き立てる
  });
}
const muteRect = () => ({ x:W-46, y:10, w:36, h:28 });
const muteHit = (x,y) => { const m=muteRect(); return x>m.x-6&&x<m.x+m.w+6&&y>m.y-6&&y<m.y+m.h+6; };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPause(true); });
addEventListener('blur',()=>setPause(true));
document.addEventListener('visibilitychange',()=>{ if(!AU.ctx) return; if(document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });

/* ========== ループ ========== */
function loop(now){
  const dt=Math.min(50,now-last); last=now;
  if(state!==prevState){ prevState=state; stT=now; sting(state); }
  if(state==='play') update(dt);
  audioTick();
  if(state==='title'){ ctx.fillStyle='#1c1d20'; ctx.fillRect(0,0,W,H);
    overlay('WANTED 6','15分間逃げ切れ。手配度は ★1 → ★6 まで上がり続ける。\nWASD/矢印: 移動   マウス: 照準・射撃   Space: ダッシュ   M: ミュート   P: ポーズ\n📱 左スティック: 移動  右スティック: 照準+射撃  DASHボタン: ダッシュ(横向き推奨)\nアイテムを3個拾うごとに強化を3択(攻撃・連射・速度・味方追加)\n\nEnter / クリック / タップで開始','#facc15'); }
  else{
    draw();
    if(state==='pick') drawPick();
    if(state==='pause') drawPause();
    if(state==='dead') overlay('BUSTED','手配度 ★'+wanted()+' / 生存 '+Math.floor(t)+'秒 / 撃破 '+kills+'\n\nEnter / クリック / タップでリトライ','#ef4444');
    if(state==='clear') overlay('ESCAPED!','15分間逃げ切った！ 撃破 '+kills+' / Lv'+p.lvl+'\n\nEnter / クリック / タップでもう一度','#4ade80');
  }
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key==='m'||e.key==='M') toggleMute();
  if(!e.repeat){
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){ if(state==='play') setPause(true); else if(state==='pause') setPause(false); }
    else if(state==='pause'&&(e.key==='r'||e.key==='R')) start();
    else if(state==='pause'&&e.key==='Enter') setPause(false);
  } if(e.key===' ')e.preventDefault();
  if(e.key==='Enter'&&(state==='title'||state==='dead'||state==='clear')) start();
  if(state==='pick'&&['1','2','3'].includes(e.key)) applyPick(choices[+e.key-1]); });
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ========== スマホ操作 ==========
   左スティック: 移動 / 右スティック: 照準+射撃(倒している間は自動連射) / DASHボタン */
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints>0;
const TS = { l:null, r:null, dashId:null };
const STICK_R = 55;
let touchMode=false, pickT=0, prevState='', stT=0;
const dashBtn = () => ({ x:W-70, y:H-190, r:44 });
function stickVec(s){ if(!s) return null; const dx=s.x-s.ox, dy=s.y-s.oy, l=Math.hypot(dx,dy); return { x:l?dx/l:0, y:l?dy/l:0, m:Math.min(1,l/STICK_R) }; }
function pickAt(x,y){
  if(performance.now()-pickT<400) return;          // 誤タップ防止
  for(let i=0;i<3;i++){ const c=cardRect(i); if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){ applyPick(choices[i]); return; } }
}
function tstart(e){
  e.preventDefault(); touchMode=true;
  for(const c of e.changedTouches){
    const x=c.clientX, y=c.clientY;
    if(state!=='title'&&muteHit(x,y)){ toggleMute(); continue; }
    if(state==='pause'){ pauseClick(x,y); continue; }
    if(state==='play'&&pauseHit(x,y)){ setPause(true); continue; }
    if(state==='pick'){ pickAt(x,y); continue; }
    if(state!=='play'){ if(performance.now()-stT>700) start(); continue; }
    const b=dashBtn();
    if(Math.hypot(x-b.x,y-b.y)<b.r+12){ TS.dashId=c.identifier; continue; }
    const st={ id:c.identifier, ox:x, oy:y, x, y };
    if(x<W/2){ if(!TS.l) TS.l=st; } else if(!TS.r) TS.r=st;
  }
}
function tmove(e){
  e.preventDefault();
  for(const c of e.changedTouches) for(const k of ['l','r']){
    const st=TS[k]; if(!st||st.id!==c.identifier) continue;
    st.x=c.clientX; st.y=c.clientY;
    const dx=st.x-st.ox, dy=st.y-st.oy, l=Math.hypot(dx,dy);
    if(l>STICK_R){ st.ox=st.x-dx/l*STICK_R; st.oy=st.y-dy/l*STICK_R; }   // 土台が指に追従
  }
}
function tend(e){
  e.preventDefault(); if(state!=='title') audioInit();   // iOSはtouchendで音が解禁される
  for(const c of e.changedTouches){
    if(TS.l&&TS.l.id===c.identifier) TS.l=null;
    if(TS.r&&TS.r.id===c.identifier) TS.r=null;
    if(TS.dashId===c.identifier) TS.dashId=null;
  }
}
cv.addEventListener('touchstart',tstart,{passive:false});
cv.addEventListener('touchmove',tmove,{passive:false});
cv.addEventListener('touchend',tend,{passive:false});
cv.addEventListener('touchcancel',tend,{passive:false});
function drawTouchUI(){
  if(state!=='play') return;
  const b=dashBtn();
  ctx.lineWidth=3; ctx.fillStyle=p.dashCd>0?'#33333388':'#f59e0b99'; ctx.strokeStyle='#ffffff99';
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('DASH',b.x,b.y+5);
  ctx.fillStyle='#ffffff66'; ctx.font='13px sans-serif';
  if(!TS.l) ctx.fillText('左: 移動',W*0.18,H-24);
  if(!TS.r) ctx.fillText('右: 照準+射撃',W*0.68,H-24);
  for(const st of [TS.l,TS.r]){ if(!st) continue;
    ctx.strokeStyle='#ffffff88'; ctx.fillStyle='#ffffff22'; ctx.beginPath(); ctx.arc(st.ox,st.oy,STICK_R,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=st===TS.r?'#ef444499':'#ffffff99'; ctx.beginPath(); ctx.arc(st.x,st.y,22,0,7); ctx.fill(); }
  ctx.textAlign='left';
}
cv.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; touchMode=false; });
cv.addEventListener('mousedown',e=>{ mouse.down=true; mouse.x=e.clientX; mouse.y=e.clientY;
  if(state!=='title'&&muteHit(mouse.x,mouse.y)){ toggleMute(); mouse.down=false; return; }
  if(state==='pause'){ pauseClick(mouse.x,mouse.y); mouse.down=false; return; }
  if(state==='play'&&pauseHit(mouse.x,mouse.y)){ setPause(true); return; }
  if(state==='pick'){ pickAt(mouse.x,mouse.y); mouse.down=false; return; }
  if(state!=='play') start(); });
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
last=performance.now(); requestAnimationFrame(loop);
</script>
</body>
